name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          mkdir -p data
          echo "SECRET_KEY=$(openssl rand -hex 32)" > .env

      - name: Build and start container
        run: docker compose up -d --build

      - name: Check health
        run: |
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8000/health

      - name: Check database persistence
        run: |
          test -s data/matches.db
          docker compose exec -T api python -c "import sqlite3; c=sqlite3.connect('/data/matches.db'); c.execute('CREATE TABLE IF NOT EXISTS persistence_check (value TEXT)'); c.execute('INSERT INTO persistence_check VALUES (?)', ('saved',)); c.commit(); c.close()"
          docker compose down
          docker compose up -d
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8000/health
          docker compose exec -T api python -c "import sqlite3; c=sqlite3.connect('/data/matches.db'); assert c.execute('SELECT value FROM persistence_check').fetchone()[0] == 'saved'; assert c.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'; print('Database persistence: OK')"

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down


