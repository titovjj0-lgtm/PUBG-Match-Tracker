name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          mkdir -p data
          echo "SECRET_KEY=$(openssl rand -hex 32)" > .env

      - name: Build and start container
        run: docker compose up -d --build

      - name: Check health
        run: |
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8000/health

      - name: Check database persistence
        run: |
          test -s data/matches.db
          sha256sum data/matches.db > /tmp/db-checksum
          docker compose down
          docker compose up -d
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8000/health
          sha256sum -c /tmp/db-checksum

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down
