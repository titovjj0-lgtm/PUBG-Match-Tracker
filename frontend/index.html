
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Match Tracker</title>
    <style>
        body {
            background: #141414;
            color: white;
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #f5a623;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
        }

        form {
            background: #242424;
            padding: 20px;
            border-radius: 12px;
            display: grid;
            gap: 12px;
        }

        input, select {
            padding: 12px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
        }

        button {
            background: #f5a623;
            color: black;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #444;
            text-align: center;
        }

        th {
            background: #242424;
            color: #f5a623;
        }

        #status {
            color: #f5a623;
        }
    </style>
</head>
<body>

    <h1>PUBG MATCH TRACKER</h1>
    <p class="subtitle">Система обліку ігрової статистики</p>

    <h2>Додати матч</h2>

    <form id="form">
        <input id="date" type="date" required>

        <input id="kills" type="number"
               min="0" placeholder="Кількість вбивств" required>

        <input id="duration" type="number"
               min="0.1" step="0.1"
               placeholder="Тривалість матчу (хв)" required>
<select id="result">
    <option value="win">Перемога</option>
    <option value="loss">Поразка</option>
</select>
       
        <input id="note" placeholder="Коментар">

        <button type="submit">ДОДАТИ МАТЧ</button>
    </form>

    <p id="status"></p>

    <h2>Історія матчів</h2>

    <table>
        <thead>
            <tr>
                <th>Дата</th>
                <th>Вбивства</th>
                <th>Хвилини</th>
                <th>Результат</th>
                <th>Коментар</th>
            </tr>
        </thead>
        <tbody id="matches"></tbody>
    </table>

    <script>
        const API = "https://api.pubgmatchtracker.pp.ua";
        const status = document.getElementById("status");

        async function loadMatches() {
            try {
                const response = await fetch(API + "/matches");

                if (!response.ok) {
                    throw new Error("Помилка API");
                }

                const matches = await response.json();
                const table = document.getElementById("matches");

                table.innerHTML = "";

                for (const match of matches) {
                    const row = document.createElement("tr");

                    const values = [
                        match.date,
                        match.kills,
                        match.duration,
                        match.result,
                        match.note || ""
                    ];

                    for (const value of values) {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    }

                    table.appendChild(row);
                }

                status.textContent = "Дані завантажено";
            } catch (error) {
                status.textContent = "Сервер поки недоступний";
            }
        }

        document.getElementById("form").addEventListener(
            "submit", async function(event) {
                event.preventDefault();

                const match = {
                    date: document.getElementById("date").value,
                    kills: Number(document.getElementById("kills").value),
                    duration: Number(document.getElementById("duration").value),
                    result: document.getElementById("result").value,
                    note: document.getElementById("note").value
                };

                try {
                    const response = await fetch(API + "/matches", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(match)
                    });

                    if (!response.ok) {
                        throw new Error("Помилка додавання");
                    }

                    event.target.reset();
                    await loadMatches();

                } catch (error) {
                    status.textContent = "Не вдалося додати матч";
                }
            }
        );

        loadMatches();
    </script>

</body>
</html>
